# ─────────────────────────────────────────────────────────────
#  gful · a cyberpunk tmux theme
#
#  palette
#    void      #0d0221   status bar background
#    grid      #261447   inactive elements, borders
#    cyan      #05d9e8   primary neon (session, active border)
#    pink      #ff2a6d   hot accent (current window, prefix alert)
#    violet    #d300c5   secondary accent (host block)
#    yellow    #f9f002   caution accent (clock, messages)
#    text      #9bf3ff   bright foreground
#    dim       #6b6b8d   muted foreground
# ─────────────────────────────────────────────────────────────

set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#0d0221,fg=#9bf3ff"
set -g status-left-length 100
set -g status-right-length 100

# ── status left: session block (flips pink while prefix is armed) ──
set -g status-left "#{?client_prefix,#[fg=#0d0221]#[bg=#ff2a6d],#[fg=#0d0221]#[bg=#05d9e8]}#[bold] ⌁ #S #{?client_prefix,#[fg=#ff2a6d],#[fg=#05d9e8]}#[bg=#0d0221]  "

# ── window tabs ──
# name tabs after the pane's current directory (manual renames still win)
set -g automatic-rename-format "#{b:pane_current_path}"
set -g window-status-separator ""
# tabs carry a Claude Code badge — the Claude logo (Nerd Font U+EC82), colored
# by state (orange working · pink needs-you · cyan done · dim idle), fed by
# Claude Code hooks — see scripts/install-claude-hooks.sh
set -g window-status-format "#[fg=#6b6b8d,bg=#0d0221]  #I ▸ #(#{@gful_dir}/scripts/claude-badge.sh #{window_id})#[fg=#6b6b8d]#W  "
set -g window-status-current-format "#[fg=#d300c5,bg=#0d0221]#[fg=#f5f5ff,bg=#d300c5,bold] #I#[fg=#ff9bf3] ▸ #(#{@gful_dir}/scripts/claude-badge.sh #{window_id})#[fg=#f5f5ff,bold]#W #[fg=#d300c5,bg=#0d0221]"
set -g window-status-activity-style "fg=#f9f002"
set -g window-status-bell-style "fg=#ff2a6d,bold"

# ── status right: claude usage ▸ clock ▸ date ▸ host ──
# usage segment reads the cache fed by scripts/claude-usage-sink.sh (see README)
set -g status-right "#(#{@gful_dir}/scripts/claude-usage.sh)#[fg=#f9f002] %H:%M #[fg=#6b6b8d]▸#[fg=#9bf3ff] %d-%b #[fg=#d300c5]#[fg=#f5f5ff,bg=#d300c5,bold] #h #[default]"

# ── panes ──
set -g pane-border-style "fg=#261447"
set -g pane-active-border-style "fg=#05d9e8"
set -g pane-border-lines heavy
set -g display-panes-colour "#6b6b8d"
set -g display-panes-active-colour "#05d9e8"

# ── command prompt / messages ──
set -g message-style "bg=#f9f002,fg=#0d0221,bold"
set -g message-command-style "bg=#261447,fg=#f9f002"

# ── copy mode / selection ──
set -g mode-style "bg=#ff2a6d,fg=#0d0221,bold"

# ── clock mode (prefix + t) ──
set -g clock-mode-colour "#05d9e8"
set -g clock-mode-style 24

# ── popups (tmux ≥3.4) ──
set -g popup-border-style "fg=#d300c5"
set -g popup-border-lines rounded

# ── menus (tmux ≥3.4) ──
set -g menu-style "bg=#0d0221,fg=#9bf3ff"
set -g menu-selected-style "bg=#ff2a6d,fg=#0d0221,bold"
set -g menu-border-style "fg=#d300c5"
set -g menu-border-lines rounded

# ── centered confirms for destructive actions ──
bind x display-menu -x C -y C -T "#[fg=#ff2a6d,bold] ⌁ kill pane #P ? " \
  "yes" y "kill-pane" \
  "no"  n ""
bind & display-menu -x C -y C -T "#[fg=#ff2a6d,bold] ⌁ kill window #W ? " \
  "yes" y "kill-window" \
  "no"  n ""
